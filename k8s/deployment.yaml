apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-2-deployment
  labels:
    app: api-2-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-2-node
  template:
    metadata:
      labels:
        app: api-2-node
    spec:
      containers:
        - name: api-2-container
          image: node:18-alpine
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-2-config
          volumeMounts:
            - mountPath: /app/data
              name: storage-volume
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: api-2-pvc